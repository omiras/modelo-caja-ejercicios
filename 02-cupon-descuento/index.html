<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cupón de descuento de La Buena Mesa</title>
  <style>
body {
  font-family: Arial, sans-serif;
  font-size: 18px;
  background-color: #fff8f0;
  color: #3d443b;
}

.cupon {
  width: 600px;
  margin: 40px auto;
  border: 5px dotted #8fae98;
  border-radius: 15px;
  background-color: #ffffff;
}

.cabecera {
  padding: 20px 24px;
  background-color: #e4efe5;
  border-radius: 10px 10px 0 0;
}

h1 {
  margin: 0 0 10px;
  font-size: 30px;
}

h2 {
  margin: 0 0 16px;
  font-size: 28px;
}

p {
  margin: 12px 0;
  line-height: 28px;
}

.foto {
  display: block;
  width: 600px;
}

.oferta {
  padding: 24px;
}

.condiciones {
  padding: 16px 24px;
  background-color: #fff0db;
  border-radius: 0 0 10px 10px;
}

.codigo {
  padding: 6px 10px;
  background-color: #d9eadc;
  color: #35583f;
}

.caducidad {
  color: #94543b;
}
  </style>
</head>
<body>
  <article class="cupon">
    <header class="cabecera">
      <h1>La Buena Mesa</h1>
      <p>Comida casera para disfrutar sin prisas</p>
    </header>
    <img class="foto" src="hamburguesa.jpg" alt="Hamburguesa con verduras y cebolla morada servida en un plato">
    <section class="oferta">
      <h2>20% de descuento en tu pedido</h2>
      <p>Date un capricho con nuestra hamburguesa de la casa. Comparte una buena comida y aprovecha este descuento en tu próxima visita.</p>
    </section>
    <footer class="condiciones">
      <p>Usa el código: <strong class="codigo">BUENAMESA20</strong></p>
      <p class="caducidad">Válido hasta el 30 de junio de 2027.</p>
    </footer>
  </article>
</body>
</html>
