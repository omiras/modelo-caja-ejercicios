<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Las redes de Alex</title>
  <style>
    body {
  margin: 30px;
  background-color: #f5eee7;
  color: #30443b;
  font-family: Arial, sans-serif;
  font-size: 16px;
}

.perfil {
  width: 650px;
  padding: 28px;
  border: 2px solid #c9d9ce;
  border-radius: 20px;
  background-color: #ffffff;
  text-align: center;
}

.avatar {
  width: 80px;
  margin: 0 0 20px;
  border-radius: 40px;
}

h1 {
  margin: 0 0 10px;
  font-size: 28px;
}

.ubicacion {
  margin: 0 0 20px;
  color: #52735b;
  font-weight: bold;
}

.descripcion {
  margin: 0 0 24px;
}

a {

  margin: 12px 0 0;
  padding: 14px;
  border: 1px solid #c9d9ce;
  border-radius: 10px;
  background-color: #edf3ef;
  color: #30443b;
  text-decoration: none;
  font-weight: bold;
}
  </style>
</head>
<body>
  <main class="perfil">
    <img class="avatar" src="avatar.jpg" alt="Retrato de Alex Rivera">
    <h1>Alex Rivera</h1>
    <p class="ubicacion">Girona, España</p>
    <p class="descripcion">Aprendiendo desarrollo web.</p>
    <nav class="redes">
      <!-- Sustituye estos destinos por las direcciones de los perfiles elegidos. -->
      <a href="https://github.com/" target="_blank">GitHub</a>
      <a href="https://www.linkedin.com/" target="_blank">LinkedIn</a>
      <a href="https://www.instagram.com/" target="_blank">Instagram</a>
      <a href="https://www.youtube.com/" target="_blank">YouTube</a>
      <a href="https://mastodon.social/" target="_blank">Mastodon</a>
    </nav>
  </main>
</body>
</html>
