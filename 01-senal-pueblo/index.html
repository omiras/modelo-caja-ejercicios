<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tres señales de tráfico</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #edf3ef;
      color: #202820;
    }
h2 {
      margin: 30px 20px;
    }

    /* Completa las propiedades de cada señal. */
    .pueblo {
      width: 500px;
      margin: 30px 20px;
      padding: 30px;
      border: 8px solid #202820;
      border-radius: 12px;
      background-color: #ffffff;
      color: #202820;
      font-size: 40px;
      font-weight: bold;
      text-align: center;
          text-transform: uppercase;
    }

    .aparcamiento {
      width: 200px;
      padding: 20px 0;
      margin: 30px 20px;
      border: 8px solid #ffffff;
      border-radius: 12px;
      background-color: #2463a6;
      color: #ffffff;
      font-size: 140px;
      font-weight: bold;
      text-align: center;
    }

    .velocidad {
      width: 180px;
      padding: 40px 0;
      margin: 30px 20px;
      border: 10px solid #c83d3d;
      border-radius: 100px;
      background-color: #ffffff;
      color: #202820;
      font-size: 88px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Señales de tráfico</h1>

  <h2>1. Entrada al pueblo</h2>
  <p class="pueblo">villa tranquila</p>

  <h2>2. Aparcamiento: señal cuadrada</h2>
  <p class="aparcamiento">P</p>

  <h2>3. Velocidad máxima: señal circular</h2>
  <p class="velocidad">50</p>
</body>
</html>
